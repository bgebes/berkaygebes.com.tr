apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: web
        # GitHub Actions her build'de bu satırı günceller
        image: ghcr.io/bgebes/berkaygebes.com.tr:ilk-build-bekleniyor
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet: {path: /, port: 3000}
          initialDelaySeconds: 5
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
