name: Build and deploy to k3s

on:
  push:
    branches: [master]
    # Actions'ın deploy/ içine yaptığı tag commit'i yeniden build tetiklemesin
    paths-ignore: ["deploy/**"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # ArgoCD bu commit'i görüp yeni image'ı k3s'e deploy eder
      - name: Update image tag
        run: |
          sed -i "s#image: ghcr.io/.*#image: $IMAGE#" deploy/deployment.yaml
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -am "deploy: ${{ github.sha }}"
          git push
